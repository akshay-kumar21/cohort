<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
</head>
<body>
    Linkdin
    <div id="post"></div>
    <button onclick = "fetchRecentdata()">Fetch latest Posts</button>
    <script>
        async function fetchRecentdata() {
            console.log("before ftech");
            // const response = await fetch("https://jsonplaceholder.typicode.com/posts");
            // const data = await response.json();
            //always use axios for fetching data from api because it is more secure, reliable and easy to use
            const response = await axios.get(
                "https://jsonplaceholder.typicode.com/posts"
            );
            const arr = response.data;
            console.log("request has been proccessed"); 
            //if if wanna display whole data u gotts stringify it and then display
            // document.getElementById("post").innerHTML = JSON.stringify(data);
            //when u do this whole data will replace the data.body so ifu wanan display both u have to append it
            /* document.getElementById("post").innerHTML +=
    "<br><br>" + JSON.stringify(data); */

            for(let i = 0; i < arr.length; i++) {
                document.getElementById("post").innerHTML += JSON.stringify(arr[i]) + "<br><br>";
            }
        }
        
    </script>
